[package]
name = "crypto"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
pbkdf2 = { version = "0.12", default-features = false }
secp256k1 = { version = "0.30", features = ["std", "global-context"] }
getrandom = "0.2"

[dev-dependencies]
hex = "0.4"
